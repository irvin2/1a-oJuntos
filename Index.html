<!doctype html> <html lang="es"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Nuestro Universo — Nephy 💜</title> <style> @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap'); :root{ --bg:#070313; --v:#9b5cff; --l:#ddb8ff; --m:#c7b8d9; } *{box-sizing:border-box} html,body{ margin:0; min-height:100%; background:#070313; color:#fff; font-family:Nunito,Arial,sans-serif; } body{ overflow-x:hidden; background: radial-gradient(circle at 50% 15%,#64278b66,transparent 35%), linear-gradient(#090313,#150622 55%,#070313); } canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; } #game{ position:relative; z-index:1; } .screen{ display:none; min-height:100vh; padding:18px; align-items:center; justify-content:center; } .screen.active{ display:flex; } .box{ width:min(950px,100%); background:#12081fdd; border:1px solid #a66cff55; border-radius:28px; padding:clamp(22px,5vw,48px); box-shadow: 0 30px 100px #000b, 0 0 60px #8e49ff18; backdrop-filter:blur(12px); } .center{text-align:center} .tiny{ font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--l); font-weight:800; } h1{ font:normal clamp(35px,7vw,72px)/1.15 'Press Start 2P'; margin:20px 0; text-shadow:0 0 25px #a75dff88; } h2{ font:normal clamp(23px,5vw,42px)/1.45 'Press Start 2P'; margin:22px 0; } .gradient{ background:linear-gradient(90deg,#fff,#e4baff,#b878ff); -webkit-background-clip:text; color:transparent; } p{ font-size:16px; line-height:1.85; color:#ddd0e9; } .subtitle{ max-width:680px; margin:auto; } .moon{ font-size:70px; filter:drop-shadow(0 0 30px #bb77ff); animation:float 4s ease-in-out infinite; } .date{ margin:20px; color:#d7b8ff; font-weight:800; } .btn{ border:1px solid #c98cff88; background:linear-gradient(135deg,#9b5cff33,#ff9de722); color:white; border-radius:999px; padding:14px 24px; font:800 14px Nunito; cursor:pointer; transition:.25s; box-shadow:0 0 25px #9b5cff25; } .btn:hover{ transform:translateY(-2px); box-shadow:0 0 35px #9b5cff55; } /* ========================= NIVEL 02 ========================= */ .gamehead{ display:flex; justify-content:space-between; align-items:center; gap:10px; } .hud{ font-weight:800; white-space:nowrap; } .bar{ height:10px; border-radius:99px; background:#ffffff10; overflow:hidden; margin:10px 0 18px; }
